<html>
<head>
	<title>人物移動</title>
	<style>
		body {
			
			background-color: #2ba367;
			background-image: radial-gradient(#6d9e3b 15%);
			background-size: 40px 40px;
			background-position: 0 0, 20px 20px;
			
		}

		
		#instructions {
			position: absolute;
			top: 20px;
			left: 20px;
			background: rgba(0, 0, 0, 0.6);
			color: rgb(255, 255, 255);
			padding: 12px 20px;
			border-radius: 8px;
			font-size: 16px;
			pointer-events: none;
			box-shadow: 0 5px px rgba(0,0,0,0.2);
			
		}

		@keyframes walking {
			0%{background-position-x: 0px;}
			100%{background-position-x: -144px;}
		}

48'/%3E%3Crect x='26' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='left-frame2' transform='translate(48, 72)'%3E%3Cpolygon points='14,24 20,8 32,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Ccircle cx='18' cy='30' r='2' fill='%232c3e50'/%3E%3Crect x='18' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='26' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='left-frame3' transform='translate(96, 72)'%3E%3Cpolygon points='14,24 20,8 32,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Ccircle cx='18' cy='30' r='2' fill='%232c3e50'/%3E%3Crect x='18' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='26' y='58' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3C!-- Row 3: Facing Right (Y: 144) --%3E%3Cg id='right-frame1' transform='translate(0, 144)'%3E%3Cpolygon points='16,24 28,8 34,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Ccircle cx='30' cy='30' r='2' fill='%232c3e50'/%3E%3Crect x='14' y='58' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='22' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='right-frame2' transform='translate(48, 144)'%3E%3Cpolygon points='16,24 28,8 34,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Ccircle cx='30' cy='30' r='2' fill='%232c3e50'/%3E%3Crect x='14' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='22' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='right-frame3' transform='translate(96, 144)'%3E%3Cpolygon points='16,24 28,8 34,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Ccircle cx='30' cy='30' r='2' fill='%232c3e50'/%3E%3Crect x='14' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='22' y='58' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3C!-- Row 4: Facing Up (Y: 216) --%3E%3Cg id='up-frame1' transform='translate(0, 216)'%3E%3Cpolygon points='12,24 24,8 36,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Crect x='15' y='58' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='27' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='up-frame2' transform='translate(48, 216)'%3E%3Cpolygon points='12,24 24,8 36,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Crect x='15' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='27' y='57' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3Cg id='up-frame3' transform='translate(96, 216)'%3E%3Cpolygon points='12,24 24,8 36,24' fill='%23f1c40f'/%3E%3Ccircle cx='24' cy='30' r='10' fill='%23fde3a7'/%3E%3Crect x='14' y='38' width='20' height='20' rx='4' fill='%239b59b6'/%3E%3Crect x='15' y='56' width='6' height='8' rx='2' fill='%23795548'/%3E%3Crect x='27' y='58' width='6' height='8' rx='2' fill='%23795548'/%3E%3C/g%3E%3C/svg%3E");
			animation: walking 600ms steps(3) infinite paused;
			position: absolute;
		}
	</style>
	<script>
		
		function mykeyup() {
			var evt = event || window.event;
			var role = document.getElementById("role");
			if (role && role.way) {
				role.way[evt.key] = false;
				role.style.animationPlayState = "paused";
			}
		}

		function mykeydown() {
			var evt = event || window.event;
			evt.preventDefault();
			var role = document.getElementById("role");
			if (!role || !role.way) return;

			
			if(evt.key == "ArrowDown") {
				role.style.backgroundPositionY = "0px";
			} else if(evt.key == "ArrowLeft") {
				role.style.backgroundPositionY = "-72px";
			} else if(evt.key == "ArrowRight") {
				role.style.backgroundPositionY = "-144px";
			} else if(evt.key == "ArrowUp") {
				role.style.backgroundPositionY = "-216px";
			}
			
			role.way[evt.key] = true;
			role.style.animationPlayState = "running";
		}

		function role_moving() {
			var role = document.getElementById("role");
			if (!role || !role.way) return;

			
			var maxW = window.innerWidth - 48;
			var maxH = window.innerHeight - 72;

			if(role.way["ArrowDown"]) {
				if(role.pos.y < maxH) role.pos.y += 3;
			} else if(role.way["ArrowLeft"]) {
				if(role.pos.x > 0) role.pos.x -= 3;
			} else if(role.way["ArrowRight"]) {
				if(role.pos.x < maxW) role.pos.x += 3;
			} else if(role.way["ArrowUp"]) {
				if(role.pos.y > 0) role.pos.y -= 3;
			}

			role.style.top = role.pos.y + "px";
			role.style.left = role.pos.x + "px";
		}

		function init(){
			var role = document.getElementById("role");
			
			
			role.pos = {
				x: Math.floor((window.innerWidth - 48) / 2),
				y: Math.floor((window.innerHeight - 72) / 2)
			};
			role.way = {"ArrowDown":0,"ArrowUp":0,"ArrowLeft":0,"ArrowRight":0};
			
			role.style.top = role.pos.y + "px";
			role.style.left = role.pos.x + "px";
			
			
			setInterval(role_moving, 20);
		}
	</script>
</head>
<body onkeydown="mykeydown();" onkeyup="mykeyup();" onload="init();">
	<div id="instructions">
		<strong> 控制說明：</strong><br>
		使用鍵盤<strong>上下左右
        </strong> 來操控
	</div>
	<div id="role"></div>
</body>
</html>
